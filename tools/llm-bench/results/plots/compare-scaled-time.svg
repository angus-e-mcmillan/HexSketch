<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Score against what it took, same paper: time" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="720" height="420" fill="#fcfcfb"/><text x="56" y="22" font-size="15" font-weight="600" fill="#0b0b0b">Score against what it took, same paper: time</text><text x="56" y="38" font-size="12" fill="#52514e">Up is more marks; left is faster. Top left is best.</text><line x1="56" x2="510" y1="368" y2="368" stroke="#e1e0d9"/><text x="48" y="372" font-size="11" text-anchor="end" fill="#898781">0</text><text x="56" y="386" font-size="11" text-anchor="middle" fill="#898781">0 s</text><line x1="56" x2="510" y1="304" y2="304" stroke="#e1e0d9"/><text x="48" y="308" font-size="11" text-anchor="end" fill="#898781">20</text><text x="146.8" y="386" font-size="11" text-anchor="middle" fill="#898781">40 s</text><line x1="56" x2="510" y1="240" y2="240" stroke="#e1e0d9"/><text x="48" y="244" font-size="11" text-anchor="end" fill="#898781">40</text><text x="237.60000000000002" y="386" font-size="11" text-anchor="middle" fill="#898781">80 s</text><line x1="56" x2="510" y1="176" y2="176" stroke="#e1e0d9"/><text x="48" y="180" font-size="11" text-anchor="end" fill="#898781">60</text><text x="328.4" y="386" font-size="11" text-anchor="middle" fill="#898781">120 s</text><line x1="56" x2="510" y1="112" y2="112" stroke="#e1e0d9"/><text x="48" y="116" font-size="11" text-anchor="end" fill="#898781">80</text><text x="419.20000000000005" y="386" font-size="11" text-anchor="middle" fill="#898781">160 s</text><line x1="56" x2="510" y1="48" y2="48" stroke="#e1e0d9"/><text x="48" y="52" font-size="11" text-anchor="end" fill="#898781">100</text><text x="510" y="386" font-size="11" text-anchor="middle" fill="#898781">200 s</text><line x1="56" x2="510" y1="368" y2="368" stroke="#c3c2b7"/><text x="283" y="408" font-size="12" text-anchor="middle" fill="#52514e">Median time per question</text><text transform="translate(16 208) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">Score (of 100)</text><circle cx="233.54691499999998" cy="64" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>HexSketch: 95 marks, 78 s</title></circle><text x="245.54691499999998" y="68" font-size="11" fill="#0b0b0b">HexSketch (95)</text><circle cx="362.89605500000005" cy="76.80000000000001" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>no HexSketch: 91 marks, 135 s</title></circle><text x="374.89605500000005" y="80.80000000000001" font-size="11" fill="#0b0b0b">no HexSketch (91)</text><circle cx="193.84574999999998" cy="121.6" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>HexSketch, website settings: 77 marks, 61 s</title></circle><text x="205.84574999999998" y="125.6" font-size="11" fill="#0b0b0b">HexSketch, website settings (77)</text><circle cx="386" cy="34" r="5" fill="#2a78d6"/><text x="395" y="38" font-size="11" fill="#52514e">Without HexSketch</text><circle cx="511" cy="34" r="5" fill="#eb6834"/><text x="520" y="38" font-size="11" fill="#52514e">With HexSketch</text></svg>