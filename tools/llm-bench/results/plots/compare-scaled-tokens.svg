cluded)</text><text transform="translate(16 208) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">Score (of 100)</text><circle cx="284.5741576923077" cy="64" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>HexSketch: 95 marks, 10k</title></circle><text x="296.5741576923077" y="68" font-size="11" fill="#0b0b0b">HexSketch (95)</text><circle cx="417.5944115384615" cy="76.80000000000001" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>no HexSketch: 91 marks, 16k</title></circle><text x="429.5944115384615" y="80.80000000000001" font-size="11" fill="#0b0b0b">no HexSketch (91)</text><circle cx="265.4432961538462" cy="121.6" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>HexSketch, website settings: 77 marks, 9.2k</title></circle><text x="277.4432961538462" y="125.6" font-size="11" fill="#0b0b0b">HexSketch, website settings (77)</text><circle cx="386" cy="34" r="5" fill="#2a78d6"/><text x="395" y="38" font-size="11" fill="#52514e">Without HexSketch</text><circle cx="511" cy="34" r="5" fill="#eb6834"/><text x="520" y="38" font-size="11" fill="#52514e">With HexSketch</text></svg>