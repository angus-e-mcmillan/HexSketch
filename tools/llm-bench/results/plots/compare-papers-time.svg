<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Old paper against new, on the same free model: time" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="720" height="420" fill="#fcfcfb"/><text x="56" y="22" font-size="15" font-weight="600" fill="#0b0b0b">Old paper against new, on the same free model: time</text><text x="56" y="38" font-size="12" fill="#52514e">Up is more marks; left is faster. Top left is best.</text><line x1="56" x2="510" y1="368" y2="368" stroke="#e1e0d9"/><text x="48" y="372" font-size="11" text-anchor="end" fill="#898781">0</text><text x="56" y="386" font-size="11" text-anchor="middle" fill="#898781">0 s</text><line x1="56" x2="510" y1="304" y2="304" stroke="#e1e0d9"/><text x="48" y="308" font-size="11" text-anchor="end" fill="#898781">20</text><text x="146.8" y="386" font-size="11" text-anchor="middle" fill="#898781">40 s</text><line x1="56" x2="510" y1="240" y2="240" stroke="#e1e0d9"/><text x="48" y="244" font-size="11" text-anchor="end" fill="#898781">40</text><text x="237.60000000000002" y="386" font-size="11" text-anchor="middle" fill="#898781">80 s</text><line x1="56" x2="510" y1="176" y2="176" stroke="#e1e0d9"/><text x="48" y="180" font-size="11" text-anchor="end" fill="#898781">60</text><text x="328.4" y="386" font-size="11" text-anchor="middle" fill="#898781">120 s</text><line x1="56" x2="510" y1="112" y2="112" stroke="#e1e0d9"/><text x="48" y="116" font-size="11" text-anchor="end" fill="#898781">80</text><text x="419.20000000000005" y="386" font-size="11" text-anchor="middle" fill="#898781">160 s</text><line x1="56" x2="510" y1="48" y2="48" stroke="#e1e0d9"/><text x="48" y="52" font-size="11" text-anchor="end" fill="#898781">100</text><text x="510" y="386" font-size="11" text-anchor="middle" fill="#898781">200 s</text><line x1="56" x2="510" y1="368" y2="368" stroke="#c3c2b7"/><text x="283" y="408" font-size="12" text-anchor="middle" fill="#52514e">Median time per question</text><text transform="translate(16 208) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">Score (of 100)</text><circle cx="319.87388" cy="80" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>new paper, no HexSketch: 90 marks, 116 s</title></circle><text x="331.87388" y="84" font-size="11" fill="#0b0b0b">new paper, no HexSketch (90)</text><circle cx="195.59705499999998" cy="80" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>new paper, HexSketch: 90 marks, 61 s</title></circle><line x1="201.59705499999998" y1="80" x2="205.59705499999998" y2="93" stroke="#898781"/><text x="207.59705499999998" y="97" font-size="11" fill="#0b0b0b">new paper, HexSketch (90)</text><circle cx="336.14297" cy="105.60000000000002" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>old paper, HexSketch: 82 marks, 123 s</title></circle><line x1="342.14297" y1="105.60000000000002" x2="346.14297" y2="118.60000000000002" stroke="#898781"/><text x="348.14297" y="122.60000000000002" font-size="11" fill="#0b0b0b">old paper, HexSketch (82)</text><circle cx="386" cy="34" r="5" fill="#2a78d6"/><text x="395" y="38" font-size="11" fill="#52514e">Without HexSketch</text><circle cx="511" cy="34" r="5" fill="#eb6834"/><text x="520" y="38" font-size="11" fill="#52514e">With HexSketch</text></svg>