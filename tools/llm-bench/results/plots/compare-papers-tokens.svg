n (thinking included)</text><text transform="translate(16 208) rotate(-90)" font-size="12" text-anchor="middle" fill="#52514e">Score (of 100)</text><circle cx="382.2723384615385" cy="80" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>new paper, no HexSketch: 90 marks, 14k</title></circle><text x="394.2723384615385" y="84" font-size="11" fill="#0b0b0b">new paper, no HexSketch (90)</text><circle cx="249.8169653846154" cy="80" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>new paper, HexSketch: 90 marks, 8.5k</title></circle><line x1="255.8169653846154" y1="80" x2="259.8169653846154" y2="93" stroke="#898781"/><text x="261.8169653846154" y="97" font-size="11" fill="#0b0b0b">new paper, HexSketch (90)</text><circle cx="298.7686423076923" cy="105.60000000000002" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"><title>old paper, HexSketch: 82 marks, 11k</title></circle><line x1="304.7686423076923" y1="105.60000000000002" x2="308.7686423076923" y2="118.60000000000002" stroke="#898781"/><text x="310.7686423076923" y="122.60000000000002" font-size="11" fill="#0b0b0b">old paper, HexSketch (82)</text><circle cx="386" cy="34" r="5" fill="#2a78d6"/><text x="395" y="38" font-size="11" fill="#52514e">Without HexSketch</text><circle cx="511" cy="34" r="5" fill="#eb6834"/><text x="520" y="38" font-size="11" fill="#52514e">With HexSketch</text></svg>