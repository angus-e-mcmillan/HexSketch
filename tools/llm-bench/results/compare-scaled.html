<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HexSketch settings compared</title>
<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--without:#2a78d6;--with:#eb6834;--page:#f9f9f7;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--without:#3987e5;--with:#d95926;--page:#0d0d0d;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--without:#3987e5;--with:#d95926;--page:#0d0d0d;color-scheme:dark}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:800px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--text2);margin:0 0 20px}
figure{margin:0 0 20px;padding:16px;background:var(--surface);border-radius:8px;border:1px solid var(--grid);overflow-x:auto}
svg{max-width:100%;height:auto;display:block}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}th,td{padding:4px 10px;border-bottom:1px solid var(--grid);text-align:left}th{color:var(--text2);font-weight:500}
</style>
<main><h1>Score against what it took, same paper</h1>
<p class="sub">scaled-even · scaled-paper. One pass each: a single answer is worth 2 to 5 marks, so small differences are noise.</p>
