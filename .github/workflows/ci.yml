# Checks every pull request and every push to main: types, tests (including the
# OPSIN round trip of generated names), the hexsketch.com build, the npm package
# and the Claude connector.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # OPSIN parses generated names back to structures; without Java those tests skip.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: tools/opsin/opsin.jar
          key: opsin-${{ hashFiles('tools/opsin/fetch.sh') }}
      - run: sh tools/opsin/fetch.sh
      - run: npm ci
      - run: npm run typecheck
      # The npm package (with the in-chat editor) first, so the tests check what was built.
      - run: npm run build:pkg
      - run: npm test
      - run: npm run build:web
      - run: node packages/hexsketch/dist/cli.js validate 'CC(=O)Oc1ccccc1C(=O)O'
      # The Claude connector (apps/mcp-worker): it bundles for Cloudflare, and answers the
      # smoke test (both sides of the in-chat editor) under wrangler dev.
      - run: cd apps/mcp-worker && npx --yes wrangler@4 deploy --dry-run --outdir /tmp/mcp-worker
      - name: Connector smoke test
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          (cd apps/mcp-worker && npx --yes wrangler@4 dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do grep -q "Ready on" /tmp/wrangler.log && break; sleep 2; done
          npm run smoke:mcp || { cat /tmp/wrangler.log; exit 1; }
      # The Claude Desktop extension, downloadable from the run's summary page to try out.
      - run: npm run build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: hexsketch-mcpb
          path: |
            packages/hexsketch/release/hexsketch.mcpb
            packages/hexsketch/release/hexsketch-mcp.zip
          retention-days: 14
