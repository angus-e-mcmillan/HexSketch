# Publishes the hexsketch package to npm when a version tag (v0.1.0, ...) is
# pushed, or when run by hand from the Actions tab, and attaches the Claude
# Desktop extension (hexsketch.mcpb) and installer (hexsketch-mcp.zip) to a
# GitHub release for the tag. Uses npm trusted publishing:
# GitHub proves to npm which workflow is publishing (OIDC), so no npm token is
# stored anywhere, and npm shows a provenance link back to this commit.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # contents: write attaches the Claude Desktop extension to the GitHub release.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Settings > Environments > npm can require an approval before anything is published.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g 'npm@^11.5.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh tools/opsin/fetch.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:pkg
      - run: npm test
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./packages/hexsketch/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build:mcpb
      - name: GitHub release with the Claude Desktop extension and installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/hexsketch/release/hexsketch.mcpb packages/hexsketch/release/hexsketch-mcp.zip --generate-notes
      # npm takes a trusted publisher only for a package it already has, so the
      # first version is published by hand (docs/releasing.md); until then, and
      # for a version already there, this step says so instead of failing.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/hexsketch/package.json').version")
          if ! npm view hexsketch name > /dev/null 2>&1; then
            echo "::warning::hexsketch is not on npm yet: publish the first version by hand (docs/releasing.md), then add the trusted publisher"
          elif [ -n "$(npm view "hexsketch@$version" version 2>/dev/null)" ]; then
            echo "::notice::hexsketch@$version is already on npm"
          else
            npm publish -w hexsketch --access public
          fi
