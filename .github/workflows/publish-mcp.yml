# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.angus-e-mcmillan/hexsketch.
# Runs on a version tag (v0.1.9, ...) alongside release.yml, or by hand from the
# Actions tab. GitHub proves to the registry which repository is publishing
# (OIDC), so no token is stored. The registry takes each version once: a
# version already there fails the publish step, which is harmless.
name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Version from packages/hexsketch/package.json
        run: |
          version=$(jq -r .version packages/hexsketch/package.json)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then test "v$version" = "$GITHUB_REF_NAME"; fi
          jq --arg v "$version" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
